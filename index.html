<title>霓虹之巅 · NEON ASCENT</title>
<style>
  *{box-sizing:border-box}

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const sign = v => v > 0 ? 1 : v < 0 ? -1 : 0;
function roundRect(g, x, y, w, h, r) {
  r = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
  g.beginPath();
  g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r);
  g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r);
  g.arcTo(x, y, x + w, y, r);
  g.closePath();
}
function fmtTime(sec) {
  if (!isFinite(sec)) return '—';
  const m = Math.floor(sec / 60), s = sec - m * 60;

}

/* ==========================================================================
   6. 游戏状态
   ========================================================================== */
const sim = {
  index: 0, def: null, grid: null, haz: null, stat: null,
  p: null, prev: { jump: false, dash: false },
  frames: 0, started: false, dead: false, deathT: 0, won: false, winT: 0, clearShL: false,
  deaths: 0, shake: 0, flash: 0, freeze: 0,
  rec: [], particles: [], dust: [], trail: [], coins: [],
  ghostFrame: 0
};
let state = 'menu';   // menu | levels | play | pause | clear | victory

/* ---------- 网格构建 ---------- */
function buildGrid(def) {
  const grid = new Uint8Array(COLS * ROWS);
  const haz = new Int8Array(COLS * ROWS); // 0 none 1 up 2 down 3 left 4 right
  def.solids.forEach(([x, y, w, h]) => {
    for (let ty = y; ty < y + h; ty++) for (let tx = x; tx < x + w; tx++)
      if (tx >= 0 && tx < COLS && ty >= 0 && ty < ROWS) grid[ty * COLS + tx] = 1;
  });
  const HD = { up: 1, down: 2, left: 3, right: 4 };
  (def.spikes || []).forEach(sp => {
    // 兼容 [x,y,w,dir] 与 [x,y,w,h,dir] 两种写法
    let x, y, w, h, dir;
    if (typeof sp[3] === 'string') { x = sp[0]; y = sp[1]; w = sp[2]; h = 1; dir = sp[3]; }
    else { x = sp[0]; y = sp[1]; w = sp[2]; h = sp[3]; dir = sp[4]; }
    for (let ty = y; ty < y + h; ty++) for (let tx = x; tx < x + w; tx++)
      if (tx >= 0 && tx < COLS && ty >= 0 && ty < ROWS) haz[ty * COLS + tx] = HD[dir] || 1;
  });
  sim.grid = grid;
  sim.haz = haz;
}
const isSolid = (tx, ty) => {
  if (tx < 0 || tx >= COLS) return true;
  if (ty < 0) return true;
  if (ty >= ROWS) return false;
  return sim.grid[ty * COLS + tx] === 1;
};
const hazAt = (tx, ty) => {
  if (tx < 0 || tx >= COLS || ty < 0 || ty >= ROWS) return 0;
  return sim.haz[ty * COLS + tx];
};

/* ---------- 背景 + 地形预渲染 ---------- */
function buildStatic(def) {
  const cv = document.createElement('canvas');
  cv.width = CW * DPR; cv.height = CH * DPR;
  const g = cv.getContext('2d');
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  const hue = def.hue;

  const bg = g.createLinearGradient(0, 0, 0, CH);
  bg.addColorStop(0, `hsl(${hue}, 42%, 7%)`);
  bg.addColorStop(0.42, `hsl(${hue + 120}, 32%, 5%)`);
  bg.addColorStop(1, '#03040a');
  g.fillStyle = bg; g.fillRect(0, 0, CW, CH);

  const gl = g.createRadialGradient(CW * 0.72, CH * 0.3, 8, CW * 0.72, CH * 0.3, CH * 0.95);
  gl.addColorStop(0, `hsla(${hue}, 92%, 58%, .17)`);
  gl.addColorStop(0.55, `hsla(${hue + 60}, 80%, 50%, .05)`);
  gl.addColorStop(1, 'hsla(0,0%,0%,0)');
  g.fillStyle = gl; g.fillRect(0, 0, CW, CH);

  // 星点
  let seed = 4817;
  const rnd = () => (seed = (seed * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
  for (let i = 0; i < 110; i++) {
    const x = rnd() * CW, y = rnd() * CH * 0.82, s = rnd() * 1.5 + 0.35;
    g.fillStyle = `hsla(${hue + rnd() * 70 - 20}, 95%, ${70 + rnd() * 25}%, ${0.05 + rnd() * 0.16})`;
    g.fillRect(x, y, s, s);
  }
  // 远景剪影
  for (let i = 0; i < 16; i++) {
    const bw = 26 + rnd() * 70, bh = 40 + rnd() * 120, bx = rnd() * CW, by = CH - 40 - bh;
    g.fillStyle = `hsla(${hue + 30}, 50%, 14%, .35)`;
    g.fillRect(bx, by, bw, bh);
    g.fillStyle = `hsla(${hue}, 90%, 60%, .10)`;
    g.fillRect(bx, by, bw, 1.5);
  }

  // 网格
  g.lineWidth = 1;
  g.strokeStyle = `hsla(${hue}, 80%, 62%, .055)`;
  for (let x = 0; x <= CW; x += TS * 2) { g.beginPath(); g.moveTo(x + .5, 0); g.lineTo(x + .5, CH); g.stroke(); }
  for (let y = 0; y <= CH; y += TS * 2) { g.beginPath(); g.moveTo(0, y + .5); g.lineTo(CW, y + .5); g.stroke(); }

  // 地形
  const base = `hsl(${hue}, 34%, 7%)`;
  for (let ty = 0; ty < ROWS; ty++) for (let tx = 0; tx < COLS; tx++) {
    if (!isSolid(tx, ty)) continue;
    g.fillStyle = base;
    g.fillRect(tx * TS, ty * TS, TS, TS);
  }
  // 露出的边
  for (let ty = 0; ty < ROWS; ty++) for (let tx = 0; tx < COLS; tx++) {
    if (!isSolid(tx, ty)) continue;
    const x = tx * TS, y = ty * TS;
    if (!isSolid(tx, ty - 1)) {
      const eg = g.createLinearGradient(0, y, 0, y + 14);
      eg.addColorStop(0, `hsla(${hue}, 100%, 72%, .95)`);
      eg.addColorStop(0.35, `hsla(${hue}, 100%, 60%, .38)`);
      eg.addColorStop(1, `hsla(${hue}, 100%, 55%, 0)`);
      g.fillStyle = eg; g.fillRect(x, y, TS, 14);
      g.fillStyle = `hsl(${hue}, 100%, 78%)`; g.fillRect(x, y, TS, 2);
    }
    if (!isSolid(tx, ty + 1)) {
      g.fillStyle = `hsla(${hue}, 60%, 45%, .18)`; g.fillRect(x, y + TS - 2, TS, 2);
    }
    if (!isSolid(tx - 1, ty)) { g.fillStyle = `hsla(${hue}, 90%, 62%, .35)`; g.fillRect(x, y, 1.5, TS); }
    if (!isSolid(tx + 1, ty)) { g.fillStyle = `hsla(${hue}, 90%, 62%, .35)`; g.fillRect(x + TS - 1.5, y, 1.5, TS); }
  }

  // 尖刺
  const spikeFill = `hsl(${hue}, 92%, 66%)`;
  for (let ty = 0; ty < ROWS; ty++) for (let tx = 0; tx < COLS; tx++) {
    const d = hazAt(tx, ty);
    if (!d) continue;
    const x = tx * TS, y = ty * TS;
    const spikes = 3;
    const grd = g.createLinearGradient(x, y, x, y + TS);
    grd.addColorStop(0, `hsla(${hue}, 100%, 78%, .95)`);
    grd.addColorStop(1, `hsla(${hue}, 90%, 45%, .55)`);
    g.fillStyle = grd;
    for (let i = 0; i < spikes; i++) {
      const f = i / spikes, f2 = (i + 1) / spikes;
      g.beginPath();
      if (d === 1) { // up
        g.moveTo(x + f * TS, y + TS); g.lineTo(x + (f + 0.5 / spikes) * TS, y + 3); g.lineTo(x + f2 * TS, y + TS);
      } else if (d === 2) { // down
        g.moveTo(x + f * TS, y); g.lineTo(x + (f + 0.5 / spikes) * TS, y + TS - 3); g.lineTo(x + f2 * TS, y);
      } else if (d === 3) { // left
        g.moveTo(x + TS, y + f * TS); g.lineTo(x + 3, y + (f + 0.5 / spikes) * TS); g.lineTo(x + TS, y + f2 * TS);
      } else { // right
        g.moveTo(x, y + f * TS); g.lineTo(x + TS - 3, y + (f + 0.5 / spikes) * TS); g.lineTo(x, y + f2 * TS);
      }
      g.closePath(); g.fill();
    }
    g.fillStyle = `hsla(${hue}, 100%, 85%, .18)`;
    g.fillRect(x, y, TS, TS);
  }

  sim.stat = cv;
}

/* ---------- 金币 ---------- */
function coinTaken(ci) {

}
function buildCoins() {

function grabCoin(c) {

  if (cs.indexOf(c.i) < 0) cs.push(c.i);

}
function startLevel(i) {

  buildGrid(sim.def);
  buildStatic(sim.def);
  resetPlayer();
  sim.frames = 0; sim.started = false;

function initDust() {
  sim.dust = [];
  for (let i = 0; i < 34; i++) {
    sim.dust.push({
      x: Math.random() * CW, y: Math.random() * CH,
      s: 0.6 + Math.random() * 1.4, v: 0.08 + Math.random() * 0.25,
      a: 0.05 + Math.random() * 0.14, ph: Math.random() * 6.28
    });
  }
}

function collideSolid(x, y, w, h) {
  const x0 = Math.floor(x / TS), x1 = Math.floor((x + w - 0.01) / TS);
  const y0 = Math.floor(y / TS), y1 = Math.floor((y + h - 0.01) / TS);
  for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++)
    if (isSolid(tx, ty)) return true;
  return false;
}
function hazardHit(x, y, w, h) {
  const px = x + 2, py = y + 2, pw = w - 4, ph = h - 4;
  const x0 = Math.floor(px / TS), x1 = Math.floor((px + pw) / TS);
  const y0 = Math.floor(py / TS), y1 = Math.floor((py + ph) / TS);
  for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++) {
    const d = hazAt(tx, ty);
    if (!d) continue;
    // 判定区比视觉小一圈，容错更友好
    let rx = tx * TS, ry = ty * TS, rw = TS, rh = TS;
    if (d === 1) { ry += 7; rh -= 7; rx += 4; rw -= 8; }
    else if (d === 2) { rh -= 7; rx += 4; rw -= 8; }
    else if (d === 3) { rw -= 7; ry += 4; rh -= 8; }
    else { rx += 7; rw -= 7; ry += 4; rh -= 8; }
    if (px < rx + rw && px + pw > rx && py < ry + rh && py + ph > ry) return true;
  }
  return false;
}

/* ---------- 粒子 ---------- */
function spawn(x, y, n, opt) {
  if (!save.settings.fx) return;
  opt = opt || {};
  for (let i = 0; i < n; i++) {
    if (sim.particles.length > 260) break;
    const a = opt.ang !== undefined ? opt.ang + (Math.random() - 0.5) * (opt.spread || 1.6) : Math.random() * 6.283;
    const sp = (opt.sp || 1.5) * (0.4 + Math.random() * 1.1);
    sim.particles.push({
      x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - (opt.up || 0),
      life: opt.life || 26, max: opt.life || 26,
      size: (opt.size || 2) * (0.6 + Math.random() * 0.9),
      col: opt.col || '#7df4ff', g: opt.g === undefined ? 0.06 : opt.g,
      kind: opt.kind || 'dot', rot: Math.random() * 6.28, vr: (Math.random() - 0.5) * 0.25
    });
  }
}
function updateParticles() {
  for (let i = sim.particles.length - 1; i >= 0; i--) {
    const q = sim.particles[i];
    q.x += q.vx; q.y += q.vy; q.vy += q.g; q.vx *= 0.97; q.rot += q.vr;
    q.life--;
    if (q.life <= 0) sim.particles.splice(i, 1);
  }
  for (const d of sim.dust) {
    d.y -= d.v; d.ph += 0.02;
    d.x += Math.sin(d.ph) * 0.12;
    if (d.y < -4) { d.y = CH + 4; d.x = Math.random() * CW; }
  }
}

/* ---------- 死亡 / 通关 ---------- */
function die() {
  if (sim.dead || sim.won) return;
  sim.dead = true; sim.deathT = 0; sim.deaths++;
  save.deaths++; persist();
  if (save.settings.shake) sim.shake = 11; sim.flash = 0.9;
  const p = sim.p;
  spawn(p.x + P_W / 2, p.y + P_H / 2, 26, { sp: 4.2, size: 2.6, life: 34, col: '#ff86c8', g: 0.14 });
  spawn(p.x + P_W / 2, p.y + P_H / 2, 12, { sp: 2.4, size: 3.4, life: 26, col: '#ffffff', g: 0.1 });
  SFX.die();
}
function win() {
  if (sim.won || sim.dead) return;
  sim.won = true; sim.winT = 0; if (save.settings.shake) sim.shake = 4; sim.flash = 0.5;
  const t = sim.frames / 60;
  const gx = (sim.def.goal[0] + 0.5) * TS, gy = (sim.def.goal[1] + 0.5) * TS;
  spawn(gx, gy, 34, { sp: 3.4, size: 2.4, life: 42, col: '#9ef8ff', g: 0.05 });
  spawn(gx, gy, 18, { sp: 2.2, size: 3, life: 40, col: '#ffd88a', g: 0.04, kind: 'confetti' });

  const rec = save.levels[sim.index] || {};
  const isPB = rec.best === undefined || t < rec.best;
  if (isPB) {
    rec.best = t;
    rec.ghost = sim.rec.slice(-1400);
    rec.par = sim.def.par;
  }
  rec.runs = (rec.runs || 0) + 1;
  rec.last = t;
  rec.deaths = sim.deaths;
  save.levels[sim.index] = rec;
  save.clears = Object.keys(save.levels).length;
  persist();
  sim.newPB = isPB;
  SFX.win();
}

function stepSim(inp) {
  // 粒子/尘埃始终流动
  updateParticles();
  if (sim.shake > 0) sim.shake *= 0.86;
  if (sim.shake < 0.2) sim.shake = 0;
  if (sim.flash > 0) sim.flash = Math.max(0, sim.flash - 0.035);

  if (sim.freeze > 0) { sim.freeze--; return; }

  if (sim.dead) {
    sim.deathT++;
    if (sim.deathT >= 17) respawn();
    return;
  }
  if (sim.won) {
    sim.winT++;
    if (sim.winT === 3) SFX.win();
    if (sim.winT > 22 && !sim.clearShL) { sim.clearShL = true; showClear(); }
    return;
  }

  if (!sim.started) {
    const any = inp.left || inp.right || inp.jump || inp.dash || inp.up || inp.down;
    if (!any) { sim.prev = { jump: !!inp.jump, dash: !!inp.dash }; return; }
    sim.started = true;
  }

  const p = sim.p;
  const edgeJ = inp.jump && !sim.prev.jump;
  const edgeD = inp.dash && !sim.prev.dash;
  sim.prev = { jump: !!inp.jump, dash: !!inp.dash };

  if (edgeJ) { p.jumpBuf = C.jumpBuf; p.jumpCut = false; }
  if (edgeD) { p.dashBuf = C.dashBuf; }

  const ax = (inp.right ? 1 : 0) - (inp.left ? 1 : 0);
  const ay = (inp.down ? 1 : 0) - (inp.up ? 1 : 0);

  // ---- 冲刺起手 ----
  if (p.dashBuf > 0 && p.dashLeft > 0 && p.dashing === 0) {
    let dx = ax, dy = ay;
    if (!dx && !dy) { dx = p.facing; dy = 0; }
    const len = Math.hypot(dx, dy) || 1;
    dx /= len; dy /= len;
    p.dashing = C.dashT; p.dashLeft = 0; p.dashBuf = 0;
    p.vx = dx * C.dashV; p.vy = dy * C.dashV;
    p.dashDX = dx; p.dashDY = dy;
    p.sx = 1.28; p.sy = 0.76;
    if (save.settings.shake) sim.shake = Math.max(sim.shake, 3.5);
    spawn(p.x + P_W / 2, p.y + P_H / 2, 12, {
      sp: 3.6, size: 2.2, life: 22, col: '#ff9ef0', g: 0.02,
      ang: Math.atan2(-dy, -dx), spread: 1.0
    });
    SFX.dash();
  }
  if (p.dashBuf > 0) p.dashBuf--;

  // ---- 跳跃 / 蹬墙 ----
  if (p.jumpBuf > 0 && p.dashing === 0) {
    if (p.coyote > 0) {
      p.vy = C.jumpV; p.coyote = 0; p.jumpBuf = 0; p.jumpCut = false;
      p.sx = 0.82; p.sy = 1.2;
      spawn(p.x + P_W / 2, p.y + P_H, 5, { sp: 1.6, size: 1.8, life: 18, col: '#8ef6ff', up: 0.4, ang: -1.57, spread: 1.9 });
      SFX.jump();
    } else if (p.onWall !== 0) {
      const w = p.onWall;
      p.vy = C.wjV; p.vx = -w * C.wjX; p.lockX = C.wjLock;
      p.coyote = 0; p.jumpBuf = 0; p.jumpCut = false;
      p.facing = -w; p.dashLeft = 1;
      p.sx = 1.22; p.sy = 0.84;
      spawn(p.x + (w > 0 ? P_W : 0), p.y + P_H / 2, 7, { sp: 2.2, size: 2, life: 20, col: '#c7a8ff', g: 0.05 });
      SFX.wall();
    }
  }
  if (p.jumpBuf > 0) p.jumpBuf--;
  if (p.coyote > 0) p.coyote--;
  if (p.lockX > 0) p.lockX--;
  if (p.dashAfter > 0) p.dashAfter--;

  if (p.dashing > 0) {
    p.dashing--;
    if (p.dashing === 0) {
      p.vx *= 0.86; p.vy *= 0.34; p.dashAfter = C.dashAfter;
    }
  } else {
    // 水平控制
    if (p.lockX === 0) {
      if (ax !== 0) {
        p.facing = ax;
        p.vx += ax * (p.grounded ? C.accG : C.accA);
      } else {
        p.vx *= p.grounded ? C.fricG : C.fricA;
        if (Math.abs(p.vx) < 0.02) p.vx = 0;
      }
      const cap = p.dashAfter > 0 ? C.maxRun * 1.55 : C.maxRun;
      p.vx = clamp(p.vx, -cap, cap);
    }

    // 重力
    p.vy += C.grav;

    // 贴墙减速
    if (p.onWall !== 0 && p.vy > 0 && (p.onWall === 1 ? ax > 0 : ax < 0)) {
      if (p.vy > C.slide) p.vy = C.slide;
      if (Math.random() < 0.22) {
        spawn(p.x + (p.onWall > 0 ? P_W : 0), p.y + 4 + Math.random() * 8, 1, {
          sp: 0.7, size: 1.6, life: 16, col: '#a8c8ff', g: -0.02
        });
      }
    }
    if (p.vy > C.maxFall) p.vy = C.maxFall;

    // 松手截断上升
    if (!inp.jump && !p.jumpCut && p.vy < -C.cutV) { p.vy = -C.cutV; p.jumpCut = true; }
  }

  // ---- 位移动（先 X 后 Y，逐轴二分回退） ----
  p.grounded = false;

  if (p.vx !== 0) {
    const nx = p.x + p.vx;
    if (!collideSolid(nx, p.y, P_W, P_H)) p.x = nx;
    else {
      let lo = 0, hi = p.vx;
      for (let i = 0; i < 6; i++) {
        const mid = (lo + hi) / 2;
        if (!collideSolid(p.x + mid, p.y, P_W, P_H)) lo = mid; else hi = mid;
      }
      p.x += lo; p.vx = 0;
    }
  }
  if (p.vy !== 0) {
    const ny = p.y + p.vy;
    if (!collideSolid(p.x, ny, P_W, P_H)) p.y = ny;
    else {
      let lo = 0, hi = p.vy;
      for (let i = 0; i < 6; i++) {
        const mid = (lo + hi) / 2;
        if (!collideSolid(p.x, p.y + mid, P_W, P_H)) lo = mid; else hi = mid;
      }
      p.y += lo;
      if (p.vy > 0) {
        p.grounded = true;
        if (p.vy > 2.2) {
          p.sx = 1.22; p.sy = 0.82;
          spawn(p.x + P_W / 2, p.y + P_H, Math.min(7, 2 + Math.floor(p.vy)), { sp: 1.5, size: 1.8, life: 16, col: '#9fe9ff', ang: -1.57, spread: 2.4, up: 0.2 });
          SFX.land();
        }
      }
      p.vy = 0;
    }
  }

  // 地面 / 墙贴合检测
  if (collideSolid(p.x + 1, p.y + 1.2, P_W - 2, P_H)) p.grounded = true;
  p.onWall = 0;
  if (collideSolid(p.x + 1.2, p.y + 3, P_W, P_H - 7)) p.onWall = 1;
  else if (collideSolid(p.x - 1.2, p.y + 3, P_W, P_H - 7)) p.onWall = -1;

  // 缓冲与补冲刺
  if (p.grounded) {
    p.coyote = C.coyote;
    if (p.dashAfter === 0) p.dashLeft = 1;
  } else if (p.onWall !== 0 && p.dashing === 0 && p.dashAfter === 0) {
    p.dashLeft = 1;
  }

  // 挤压回弹
  p.sx += (1 - p.sx) * 0.22;
  p.sy += (1 - p.sy) * 0.22;

  // 拖影
  p.trailT++;
  if (p.trailT % 2 === 0) {
    sim.trail.push({ x: p.x, y: p.y, life: 18 });
    if (sim.trail.length > 14) sim.trail.shift();
  }
  for (let i = sim.trail.length - 1; i >= 0; i--) {
    if ((sim.trail[i].life--) <= 0) sim.trail.splice(i, 1);
  }

  // ---- 危险判定 ----
  if (hazardHit(p.x, p.y, P_W, P_H)) { die(); return; }
  if (p.y > CH + 40) { die(); return; }

  // ---- 金币 ----
  const pcx = p.x + P_W / 2, pcy = p.y + P_H / 2;
  for (const c of sim.coins) {
    if (c.got) continue;
    const cx = c.x * TS + TS / 2, cy = c.y * TS + TS / 2;
    if (Math.abs(pcx - cx) < 10 && Math.abs(pcy - cy) < 11) grabCoin(c);
  }

  // ---- 终点 ----
  const gl = sim.def.goal;
  const gx = gl[0] * TS + 2, gy = gl[1] * TS + 2, gw = TS - 4, gh = TS - 4;
  if (p.x < gx + gw && p.x + P_W > gx && p.y < gy + gh && p.y + P_H > gy) { win(); return; }

  // ---- 计时 / 残影记录 ----
  sim.frames++;
  if (sim.frames % 2 === 0 && sim.rec.length < 1600) {
    sim.rec.push([sim.frames, Math.round(p.x * 10) / 10, Math.round(p.y * 10) / 10]);
  }
}

/* ==========================================================================
   8. 渲染
   ========================================================================== */
function drawPlayerAt(g, cx, cy, alpha, pal, sx, sy) {
  const P = pal || curSkin();
  const w = P_W - 2, h = P_H;
  g.save();
  g.globalAlpha = alpha;
  g.translate(cx, cy);
  g.scale(sx || 1, sy || 1);
  g.shadowColor = P.glow || 'rgba(110,240,255,.9)';
  g.shadowBlur = 16;
  const grd = g.createLinearGradient(0, -h / 2, 0, h / 2);
  grd.addColorStop(0, P.body[0]);
  grd.addColorStop(0.55, P.body[1]);
  grd.addColorStop(1, P.body[2]);
  g.fillStyle = grd;
  roundRect(g, -w / 2, -h / 2, w, h, 4);
  g.fill();
  g.shadowBlur = 0;
  // 面罩
  g.fillStyle = 'rgba(255,255,255,.85)';
  roundRect(g, -1.5, -h / 2 + 3, 5.5, 3, 1.4);
  g.fill();
  g.restore();
}
function drawGhost(g) {
  if (!save.settings.ghost) return;
  const rec = save.levels[sim.index];
  if (!rec || !rec.ghost || !rec.ghost.length) return;
  const gh = rec.ghost, f = sim.frames;
  if (f > gh[gh.length - 1][0] + 240) return;
  let lo = 0, hi = gh.length - 1;
  while (lo < hi) {
    const mid = (lo + hi + 1) >> 1;
    if (gh[mid][0] <= f) lo = mid; else hi = mid - 1;
  }
  const a = gh[lo], b = gh[Math.min(lo + 1, gh.length - 1)];
  const k = b[0] > a[0] ? clamp((f - a[0]) / (b[0] - a[0]), 0, 1) : 0;
  const x = a[1] + (b[1] - a[1]) * k + P_W / 2;
  const y = a[2] + (b[2] - a[2]) * k + P_H / 2;
  drawPlayerAt(g, x, y, 0.30, GHOST_PAL, 1, 1);
}
function render(now) {
  const g = ctx;
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  g.clearRect(0, 0, CW, CH);
  if (!sim.def) return;

  const sh = sim.shake;
  if (sh > 0) g.translate((Math.random() - 0.5) * sh, (Math.random() - 0.5) * sh);

  // 背景
  if (sim.stat) g.drawImage(sim.stat, 0, 0, CW, CH);

  // 尘埃
  for (const d of sim.dust) {
    g.fillStyle = `hsla(${sim.def.hue}, 90%, 78%, ${d.a})`;
    g.fillRect(d.x, d.y, d.s, d.s);
  }

  // 终点门
  const gl = sim.def.goal, hue = sim.def.hue;
  const gx = (gl[0] + 0.5) * TS, gy = (gl[1] + 0.5) * TS;
  const t = now * 0.001;
  const pulse = Math.sin(t * 2.6) * 0.5 + 0.5;
  g.save();
  g.translate(gx, gy);
  g.shadowColor = `hsla(${hue},100%,70%,.95)`;
  g.shadowBlur = 16 + pulse * 12;
  const core = g.createRadialGradient(0, 0, 1, 0, 0, 13);
  core.addColorStop(0, 'rgba(255,255,255,.95)');
  core.addColorStop(0.4, `hsla(${hue},100%,70%,.85)`);
  core.addColorStop(1, `hsla(${hue},100%,55%,0)`);
  g.fillStyle = core;
  g.beginPath(); g.arc(0, 0, 13, 0, 6.283); g.fill();
  g.strokeStyle = `hsla(${hue},100%,80%,.9)`;
  g.lineWidth = 1.5;
  g.beginPath(); g.arc(0, 0, 8 + pulse * 3, 0, 6.283); g.stroke();
  g.restore();

  // 金币
  for (const c of sim.coins) {
    if (c.got) continue;
    const cx = c.x * TS + TS / 2, cy = c.y * TS + TS / 2 + Math.sin(now * 0.003 + c.i) * 1.8;
    const sc = 0.75 + Math.abs(Math.sin(now * 0.004 + c.i)) * 0.35;
    g.save();
    g.translate(cx, cy);
    g.scale(sc, 1);
    g.shadowColor = 'rgba(255,205,100,.95)'; g.shadowBlur = 12;
    const cg = g.createLinearGradient(0, -6, 0, 6);
    cg.addColorStop(0, '#fff3c4'); cg.addColorStop(0.5, '#ffd479'); cg.addColorStop(1, '#e08b1c');
    g.fillStyle = cg;
    g.beginPath(); g.moveTo(0, -6); g.lineTo(4.6, 0); g.lineTo(0, 6); g.lineTo(-4.6, 0); g.closePath(); g.fill();
    g.restore();
  }

  // 残影
  drawGhost(g);

  // 拖影
  for (const tr of sim.trail) {
    const a = tr.life / 18;
    drawPlayerAt(g, tr.x + P_W / 2, tr.y + P_H / 2, a * 0.28, curSkin(), 1, 1);
  }

  // 粒子（后层）
  for (const q of sim.particles) {
    const a = Math.max(0, q.life / q.max);
    g.globalAlpha = a;
    if (q.kind === 'confetti') {
      g.save(); g.translate(q.x, q.y); g.rotate(q.rot);
      g.fillStyle = q.col; g.fillRect(-q.size, -q.size * 0.6, q.size * 2, q.size * 1.2);
      g.restore();
    } else {
      g.fillStyle = q.col;
      g.beginPath(); g.arc(q.x, q.y, q.size * (0.4 + a * 0.6), 0, 6.283); g.fill();
    }
  }
  g.globalAlpha = 1;

  // 玩家
  const p = sim.p;
  if (!sim.dead) {
    // 冲刺可用指示
    if (!sim.won) {
      const dx2 = p.x + P_W / 2, dy2 = p.y - 7;
      g.save();
      g.globalAlpha = 0.75;
      g.fillStyle = p.dashLeft > 0 ? '#ff9ef0' : 'rgba(120,150,175,.5)';
      g.shadowColor = p.dashLeft > 0 ? 'rgba(255,140,240,.9)' : 'transparent';
      g.shadowBlur = p.dashLeft > 0 ? 8 : 0;
      g.beginPath(); g.arc(dx2, dy2, 2.1, 0, 6.283); g.fill();
      g.restore();
    }
    drawPlayerAt(g, p.x + P_W / 2, p.y + P_H / 2, 1, null, p.sx, p.sy);
  }

  // 粒子（前层闪光）
  g.globalAlpha = 1;

  // 关卡名开场
  if (sim.frames < 110 && !sim.dead) {
    const k = sim.frames < 20 ? sim.frames / 20 : (sim.frames > 80 ? Math.max(0, (110 - sim.frames) / 30) : 1);
    g.save();
    g.globalAlpha = k;
    g.textAlign = 'center';
    g.font = '800 26px ui-monospace, Menlo, monospace';
    g.fillStyle = `hsla(${hue}, 100%, 82%, .95)`;
    g.shadowColor = `hsla(${hue},100%,60%,.9)`; g.shadowBlur = 18;
    g.fillText(sim.def.en, CW / 2, CH / 2 - 20);
    g.shadowBlur = 0;
    g.font = '600 13px -apple-system, "PingFang SC", sans-serif';
    g.fillStyle = 'rgba(220,245,255,.7)';
    g.fillText(sim.def.name, CW / 2, CH / 2 + 4);
    g.restore();
  }

  // HUD
  if (state !== 'menu' && state !== 'levels' && state !== 'skins' && state !== 'settings') drawHUD(g, hue);

  // 死亡闪白
  if (sim.flash > 0) {
    g.fillStyle = `rgba(255,120,190,${sim.flash * 0.35})`;
    g.fillRect(-20, -20, CW + 40, CH + 40);
  }

  // 暗角
  const vg = g.createRadialGradient(CW / 2, CH / 2, CH * 0.42, CW / 2, CH / 2, CH * 0.95);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,.55)');
  g.fillStyle = vg; g.fillRect(0, 0, CW, CH);
}

function drawHUD(g, hue) {
  const idx = sim.index;
  g.save();
  g.textAlign = 'left';
  g.font = '700 10px ui-monospace, Menlo, monospace';
  g.fillStyle = 'rgba(175,220,240,.6)';
  g.fillText('ROOM ' + String(idx + 1).padStart(2, '0') + ' / ' + String(LEVELS.length).padStart(2, '0'), 14, 20);

  if (save.settings.timer) {
    const tm = fmtTime(sim.frames / 60);
    g.font = '800 22px ui-monospace, Menlo, monospace';
    g.fillStyle = '#eafdff';
    g.shadowColor = `hsla(${hue},100%,65%,.65)`; g.shadowBlur = 12;
    g.fillText(tm, 13, 45);
    g.shadowBlur = 0;
  }

  // 金币：本房间 / 钱包
  const got = sim.coins.filter(c => c.got).length;
  g.textAlign = 'center';
  g.font = '800 12px ui-monospace, Menlo, monospace';
  g.fillStyle = '#ffd479';
  g.shadowColor = 'rgba(255,190,80,.7)'; g.shadowBlur = 10;
  g.fillText('◈ ' + got + '/' + sim.coins.length + '   ◈ ' + save.coins, CW / 2, 20);
  g.shadowBlur = 0;
  g.textAlign = 'left';

  g.textAlign = 'right';
  g.font = '700 10px ui-monospace, Menlo, monospace';
  g.fillStyle = 'rgba(175,220,240,.55)';
  g.fillText('DEATHS', CW - 14, 20);
  g.font = '800 15px ui-monospace, Menlo, monospace';
  g.fillStyle = sim.deaths > 0 ? '#ff9ecb' : 'rgba(200,235,250,.7)';
  g.fillText(String(sim.deaths).padStart(2, '0'), CW - 14, 38);

  const rec = save.levels[idx];
  g.fillStyle = 'rgba(150,195,220,.45)';
  g.font = '600 9.5px ui-monospace, Menlo, monospace';
  g.fillText(rec && rec.best !== undefined ? 'BEST ' + fmtTime(rec.best) : 'BEST —', CW - 14, 54);

  // 提示
  if (sim.frames < 330 && !sim.dead) {
    const a = sim.frames < 60 ? sim.frames / 60 : (sim.frames > 260 ? (330 - sim.frames) / 70 : 1);
    g.textAlign = 'center';
    g.globalAlpha = clamp(a, 0, 1);
    g.font = '600 11.5px -apple-system, "PingFang SC", sans-serif';
    g.fillStyle = 'rgba(210,240,255,.72)';
    g.fillText(sim.def.hint, CW / 2, CH - 16);
    g.globalAlpha = 1;
  }
  g.restore();
}

/* ==========================================================================
   9. 输入
   ========================================================================== */
const held = { left: 0, right: 0, up: 0, down: 0, jump: 0, dash: 0 };
const CODEMAP = {
  ArrowLeft: 'left', KeyA: 'left',
  ArrowRight: 'right', KeyD: 'right',
  ArrowUp: 'up', KeyW: 'up',
  ArrowDown: 'down', KeyS: 'down',
  KeyZ: 'jump', Space: 'jump', KeyK: 'jump', Enter: 'jump',
  KeyX: 'dash', ShiftLeft: 'dash', ShiftRight: 'dash', KeyJ: 'dash'
};
const pressed = new Set();
function syncKeys() {
  held.left = held.right = held.up = held.down = held.jump = held.dash = 0;
  for (const code of pressed) {
    const k = CODEMAP[code];
    if (k) held[k] = 1;
  }
}
window.addEventListener('keydown', e => {
  const k = CODEMAP[e.code];
  if (k) { pressed.add(e.code); syncKeys(); audioInit(); if (e.code === 'Space' || e.code.startsWith('Arrow')) e.preventDefault(); }
  if (e.code === 'KeyR' && state === 'play') { startLevel(sim.index); SFX.ui(); }
  if ((e.code === 'KeyP' || e.code === 'Escape')) {
    if (state === 'play') pauseGame();
    else if (state === 'pause') resumeGame();
  }
  if (e.code === 'KeyM') toggleMute();
});
window.addEventListener('keyup', e => {
  if (CODEMAP[e.code]) { pressed.delete(e.code); syncKeys(); }
});
window.addEventListener('blur', () => { pressed.clear(); syncKeys(); });

document.querySelectorAll('.tbtn').forEach(btn => {
  const k = btn.dataset.k;
  const down = e => {
    e.preventDefault(); audioInit();
    try { btn.setPointerCapture(e.pointerId); } catch (err) {}
    held[k] = 1; btn.classList.add('down');
  };
  const up = () => { held[k] = 0; btn.classList.remove('down'); };
  btn.addEventListener('pointerdown', down);
  btn.addEventListener('pointerup', up);
  btn.addEventListener('pointercancel', up);
  btn.addEventListener('lostpointercapture', up);
  btn.addEventListener('contextmenu', e => e.preventDefault());
});
document.addEventListener('touchmove', e => {
  if (e.target.closest('#overlay')) return;
  e.preventDefault();
}, { passive: false });
document.addEventListener('gesturestart', e => e.preventDefault());

function updatePadVisibility() {
  padEl.classList.toggle('on', isTouch() && state === 'play');
}

function medalOf(t, par) {
  if (t === undefined) return 'none';
  if (t <= par) return 'gold';
  if (t <= par * 1.35) return 'silver';
  if (t <= par * 1.9) return 'bronze';
  return 'none';
}
const MEDAL_TXT = { gold: '黄金 ★', silver: '白银 ◆', bronze: '青铜 ▲', none: '未评级' };
const MEDAL_EN = { gold: 'GOLD', silver: 'SILVER', bronze: 'BRONZE', none: 'CLEARED' };

function overlayOn(html) {
  overlayEl.innerHTML = html;
  overlayEl.classList.add('on');
  updatePadVisibility();
}
function hideOverlay() {
  overlayEl.classList.remove('on');
  overlayEl.innerHTML = '';
  updatePadVisibility();
}
function unlocked(i) {
  if (i === 0) return true;
  const prev = save.levels[i - 1];
  return !!(prev && prev.best !== undefined);
}
function clearedCount() {
  return LEVELS.reduce((n, _, i) => n + (save.levels[i] && save.levels[i].best !== undefined ? 1 : 0), 0);
}

function pauseGame() {
  if (state !== 'play') return;
  state = 'pause';
  overlayOn(`
    <div class="card">
      <div class="stamp">PAUSED</div>
      <div class="bigtime" style="font-size:24px">${fmtTime(sim.frames / 60)}</div>

      <button class="btn primary" data-act="resume">继续</button>

}
function resumeGame() {
  if (state !== 'pause') return;
  state = 'play';
  hideOverlay();
}
function showClear() {
  state = 'clear';
  const i = sim.index, def = sim.def;
  const rec = save.levels[i] || {};
  const t = sim.frames / 60;
  const m = medalOf(t, def.par);
  const last = i === LEVELS.length - 1;
  overlayOn(`
    <div class="card">
      <div class="stamp">${last ? 'SUMMIT' : 'ROOM CLEAR'}</div>
      <div class="brand" style="font-size:24px">${def.name}</div>
      <div class="cn" style="margin:6px 0 6px">${def.en}</div>
      <div class="bigtime">${fmtTime(t)}</div>
      <div class="sub">目标 ${fmtTime(def.par)} · 死亡 ${sim.deaths} 次 · 本房金币 ${sim.coins.filter(c => c.got).length}/${sim.coins.length}</div>
      <div class="medal ${m}">${MEDAL_EN[m]}${sim.newPB ? ' · 新纪录' : ''}</div>
      <div class="clearrow">
        <div class="clearcell">最佳<b>${fmtTime(rec.best)}</b></div>
        <div class="clearcell">累计死亡<b>${save.deaths}</b></div>
      </div>
      ${last
        ? '<button class="btn primary" data-act="victory">查看登顶记录</button>'
        : '<button class="btn primary" data-act="next">下一房间</button>'}
      <div class="row">
        <button class="btn ghost" data-act="retry">重试</button>
        <button class="btn ghost" data-act="levels">选关</button>
      </div>
    </div>`);
}
function showVictory() {
  state = 'victory';
  let total = 0;
  const rows = LEVELS.map((l, i) => {
    const rec = save.levels[i] || {};
    if (rec.best) total += rec.best;
    return `<div class="recLine"><span>${l.name}</span><b>${rec.best !== undefined ? fmtTime(rec.best) : '—'}</b></div>`;
  }).join('');
  overlayOn(`
    <div class="card">
      <div class="stamp">ALL CLEAR</div>
      <div class="brand" style="font-size:26px">ASCENDED</div>
      <div class="cn" style="margin:8px 0 4px">你已登顶</div>
      <div class="bigtime" style="font-size:26px">${fmtTime(total)}</div>
      <div class="sub">${LEVELS.length} 段最佳成绩之和 · 金币 ${save.coins} · 累计死亡 ${save.deaths}</div>
      <div class="scroll">${rows}</div>
      <div class="hintSmall">想更快？打开残影，追着自己跑。</div>
      <button class="btn primary" data-act="levels">回到选关</button>
      <button class="btn ghost" data-act="home">标题</button>
    </div>`);
}
function showSkins() {
  state = 'skins';
  const cards = SKINS.map((s, i) => {
    const owned = save.owned.indexOf(s.id) >= 0;
    const on = save.skin === s.id;
    const afford = save.coins >= s.cost;
    const st = on ? '使用中' : owned ? '装备' : '◈ ' + s.cost;
    return `<button class="skin ${on ? 'on' : ''} ${!owned && !afford ? 'poor' : ''}" data-act="skin" data-i="${i}">
      <span class="sw" style="background:linear-gradient(160deg,${s.body[0]},${s.body[1]},${s.body[2]})"></span>
      <span class="sn">${s.name}</span>
      <span class="sc ${on ? 'on' : owned ? 'ok' : afford ? 'buy' : 'no'}">${st}</span>
    </button>`;
  }).join('');
  overlayOn(`
    <div class="card">
      <div class="brand" style="font-size:22px">SKINS</div>
      <div class="cn" style="margin:8px 0 10px">机 体 涂 装</div>
      <div class="wallet">◈ <b>${save.coins}</b></div>
      <div class="skinGrid">${cards}</div>
      <div class="hintSmall">金币在关卡里收：每间 3 枚，拿了就不再出现。<br>买下即装备，涂装只影响外观，不改手感。</div>
      <button class="btn ghost" data-act="home" style="margin-top:14px">返回</button>
    </div>`);
}
function showSettings() {
  state = 'settings';
  const st = save.settings;
  const row = (k, label, tip) => `<div class="setRow">
      <span class="sl">${label}<i>${tip || ''}</i></span>
      <button class="tgl ${st[k] ? 'on' : ''}" data-act="opt" data-k="${k}">${st[k] ? '开' : '关'}</button>
    </div>`;
  overlayOn(`
    <div class="card">
      <div class="brand" style="font-size:22px">SETTINGS</div>
      <div class="cn" style="margin:8px 0 12px">设 置</div>
      ${row('sfx', '音效', '按键与事件音')}
      <div class="setRow">
        <span class="sl">音量<i id="volv">${Math.round(st.vol * 100)}%</i></span>
        <input class="rng" id="vol" type="range" min="0" max="100" value="${Math.round(st.vol * 100)}">
      </div>
      ${row('shake', '屏幕震动', '死亡与冲刺的抖动')}
      ${row('ghost', '最佳残影', '用自己最快的路线陪跑')}
      ${row('fx', '粒子特效', '受伤、落地、拾取的火花')}
      ${row('timer', '显示计时', '关掉更干净，成绩照旧记录')}
      <div class="setRow">
        <span class="sl">存档<i>金币 ${save.coins} · 已通过 ${clearedCount()} / ${LEVELS.length}</i></span>
        <button class="tgl danger" data-act="reset">清空</button>
      </div>
      <div class="hintSmall">成绩、金币、皮肤、设置都会自动保存在这台设备上。</div>
      <button class="btn ghost" data-act="home" style="margin-top:14px">返回</button>
    </div>`);
}
function toggleMute() {
  save.settings.sfx = !save.settings.sfx;
  muted = !save.settings.sfx;
  persist();
  if (state === 'menu') showMenu();
  else if (state === 'settings') showSettings();
  SFX.ui();
}
function buzz() {
  const card = overlayEl.querySelector('.card');
  if (!card) return;
  card.classList.add('bad');
  setTimeout(() => card.classList.remove('bad'), 420);
}

overlayEl.addEventListener('input', e => {
  if (e.target && e.target.id === 'vol') {
    save.settings.vol = (+e.target.value) / 100;
    persist();
    const lv = document.getElementById('volv');
    if (lv) lv.textContent = Math.round(save.settings.vol * 100) + '%';
  }
});
overlayEl.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  audioInit();
  const act = b.dataset.act;
  const i = parseInt(b.dataset.i, 10);
  SFX.ui();
  if (act === 'play') {
    let start = 0;
    for (let k = 0; k < LEVELS.length; k++) if (unlocked(k)) start = k;
    startLevel(Math.min(start, LEVELS.length - 1));
  }
  else if (act === 'levels') showLevels();
  else if (act === 'level') { if (unlocked(i)) startLevel(i); }
  else if (act === 'resume') resumeGame();
  else if (act === 'retry') startLevel(sim.index);
  else if (act === 'next') startLevel(Math.min(sim.index + 1, LEVELS.length - 1));
  else if (act === 'home') showMenu();
  else if (act === 'skins') showSkins();
  else if (act === 'settings') showSettings();
  else if (act === 'skin') {
    const sk = SKINS[i];
    if (!sk) return;
    if (save.owned.indexOf(sk.id) >= 0) {
      save.skin = sk.id; persist(); SFX.ui(); showSkins();
    } else if (save.coins >= sk.cost) {
      save.coins -= sk.cost; save.owned.push(sk.id); save.skin = sk.id;
      persist(); SFX.buy(); showSkins();
    } else { SFX.deny(); buzz(); }
  }
  else if (act === 'opt') {
    const k = b.dataset.k;
    save.settings[k] = !save.settings[k];
    if (k === 'sfx') muted = !save.settings.sfx;
    persist(); SFX.ui(); showSettings();
  }
  else if (act === 'mute') toggleMute();
  else if (act === 'reset') {
    if (confirm('清空全部存档？金币、皮肤、成绩都会重置，且无法恢复。')) {
      save = newSave(); muted = !save.settings.sfx;
      persist(); showMenu();
    }
  }
  else if (act === 'victory') showVictory();
});

/* ==========================================================================
   11. 主循环
   ========================================================================== */
let lastT = 0, acc = 0;
const STEP = 1 / 60;
function loop(now) {
  const dt = Math.min(0.06, (now - lastT) / 1000 || 0);
  lastT = now;
  if (state === 'play') {
    acc += dt;
    let guard = 0;
    while (acc >= STEP && guard < 5) { stepSim(held); acc -= STEP; guard++; }
    if (guard >= 5) acc = 0;
  } else {
    acc = 0;
    if (state === 'menu' || state === 'levels' || state === 'clear' || state === 'victory' || state === 'pause' || state === 'skins' || state === 'settings') {
      // 覆盖层下的背景保持轻微流动
      updateParticles();
      if (sim.shake > 0) sim.shake *= 0.86;
    }
  }
  render(now);
  requestAnimationFrame(loop);
}

/* ==========================================================================
   12. 启动
   ========================================================================== */
resize();
// 菜单背景使用第一关的地形
sim.index = 0;
sim.def = LEVELS[0];
buildGrid(LEVELS[0]);
buildStatic(LEVELS[0]);
resetPlayer();
initDust();
sim.frames = 0;
showMenu();
requestAnimationFrame(now => { lastT = now; requestAnimationFrame(loop); });

/* ==========================================================================
   13. 调试接口（用于自动化验证，不影响正常游玩）
   ========================================================================== */
window.__NEON = {
  CW, CH, TS, COLS, ROWS,
  levels: LEVELS,
  load(i) { startLevel(i); state = 'debug'; hideOverlay(); },
  reset() { respawn(); sim.frames = 0; sim.started = false; sim.dead = false; sim.won = false; sim.deaths = 0; },
  // 测试用：把角色放到指定格（站立状态）
  place(tx, ty) {
    const p = sim.p;
    p.x = tx * TS + (TS - P_W) / 2; p.y = (ty + 1) * TS - P_H;
    p.vx = 0; p.vy = 0; p.dashing = 0; p.dashLeft = 1; p.dashAfter = 0; p.onWall = 0;
    p.jumpBuf = 0; p.dashBuf = 0; p.coyote = C.coyote;
    sim.dead = false; sim.won = false; sim.started = true;
  },
  step(inp) { stepSim(inp); },
  state() {
    const p = sim.p;
    return {
      x: p.x, y: p.y, vx: p.vx, vy: p.vy, grounded: p.grounded, wall: p.onWall,
      dash: p.dashLeft, dead: sim.dead, won: sim.won, deaths: sim.deaths,
      frames: sim.frames, started: sim.started
    };
  },
  grid(i) {
    const out = [];
    for (let y = 0; y < ROWS; y++) {
      let line = '';
      for (let x = 0; x < COLS; x++) {
        const d = hazAt(x, y);
        line += isSolid(x, y) ? '#' : d ? ['', '^', 'v', '<', '>'][d] : '.';
      }
      out.push(line);
    }
    return out;
  },
  simulate(actions) {
    // actions: 每帧一个 {left,right,up,down,jump,dash}
    this.reset();
    for (let f = 0; f < actions.length; f++) {
      const s = this.state();
      if (s.dead || s.won) break;
      stepSim(actions[f]);
    }
    return this.state();
  }
};
})();
</script>
